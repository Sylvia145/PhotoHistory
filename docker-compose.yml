services:
  backend:
    build: ./backend
    container_name: photohistory-backend
    ports:
      - "18000:8000"
    volumes:
      - ./backend:/app
      - backend_data:/data
      - ./backend/uploads:/app/uploads
    environment:
      - DATABASE_URL=sqlite:////data/photohistory.db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - PHOTOHISTORY_LLM_PROVIDER=${PHOTOHISTORY_LLM_PROVIDER:-anthropic}
      - PHOTOHISTORY_LLM_MODEL=${PHOTOHISTORY_LLM_MODEL:-claude-sonnet-4-6}
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    container_name: photohistory-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: >
      sh -c "npm install && npx vite --host 0.0.0.0 --port 5173"
    environment:
      - VITE_API_TARGET=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
  backend_uploads:
